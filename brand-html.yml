meta:
  name: Sustainable AI Group

logo:
  medium: assets/saig-logo.png
  large: assets/saig-logo.png

color:
  palette:
    monarch-orange: "#B8663B"
    amber-orange: "#F2A74C"
    sunset-orange: "#DD784F"
    deep-teal: "#2B6572"
    aqua-teal: "#55BAC0"
    dusty-teal: "#4B9DA3"
    deep-ocean: "#033845"
    charcoal: "#242424"
    warm-sand: "#EED4B9"
    soft-ivory: "#F5E7D2"
    light-cream: "#F5F1E9"
    mist-gray: "#E6ECED"
    muted-teal: "#4F747D"
  foreground: charcoal
  background: "#FFFFFF"
  primary: deep-teal
  secondary: monarch-orange
  tertiary: aqua-teal
  light: light-cream
  dark: deep-ocean
  link: deep-teal

typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 500, 600, 700]
    - family: DM Sans
      source: google
      weight: [400, 500, 600, 700]
    - family: DM Mono
      source: google
      weight: [400, 500]
  base:
    family: DM Sans
    size: 11pt
    line-height: 1.55
  headings:
    family: Inter
    weight: 500
    color: deep-teal
  monospace:
    family: DM Mono
    size: 0.9em
    color: deep-ocean
  link:
    color: deep-teal
    decoration: underline
