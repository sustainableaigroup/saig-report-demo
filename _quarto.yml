project:
  type: default
  output-dir: docs

brand: _brand.yml
bibliography: references.bib

execute:
  freeze: auto

format:
  html:
    theme: [brand, styles.scss]
    toc: true
    toc-location: left
    toc-title: Contents
    toc-depth: 2
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    anchor-sections: true
    link-external-newwindow: true
    fig-cap-location: bottom
    code-fold: true
  typst:
    toc: true
    toc-depth: 2
    papersize: us-letter
    margin:
      top: 0.78in
      bottom: 0.78in
      left: 0.82in
      right: 0.82in
    fontsize: 10.5pt
    keep-typ: true
    fig-cap-location: bottom
    tbl-cap-location: top
    include-in-header: typst/saig-header.typ
